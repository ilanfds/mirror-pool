name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, toolchain-light checks over the whole workspace. The on-chain program
  # tests compile here but skip at runtime (no built .so); they run for real in
  # the `program` job below.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Builds the Anchor program to BPF and runs the LiteSVM on-chain tests (the
  # cross-check, round lifecycle, Groth16 verification, incentives, and the
  # replay/phase guards).
  program:
    name: on-chain program (anchor build + litesvm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install --locked --version 1.1.2 anchor-cli

      - name: Build program (BPF)
        run: anchor build

      - name: Test program
        run: cargo test -p mirror-pool-program
