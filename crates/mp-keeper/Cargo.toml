[package]
name = "mp-keeper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mirror-pool trust-minimized execution synchronizer"

[lib]
name = "mp_keeper"
path = "src/lib.rs"

[[bin]]
name = "mp-keeper"
path = "src/main.rs"

[dependencies]
solana-instruction = "3.0"
solana-pubkey = "3.0"
solana-transaction = { version = "3.0", features = ["bincode"] }
solana-message = "3.0"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-hash = "3.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-system-interface = { version = "3.0", features = ["bincode"] }
solana-nonce = { version = "3.2", features = ["serde"] }
bincode = "1.3"
